<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boxing Arena - Torneo a Round</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a2a1a; touch-action: none; }
        
        /* Schermata di caricamento */
        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a2a1a; color: #f1c40f; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
        }

        #main-menu, #multiplayer-menu, #room-settings {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(30, 50, 30, 0.95), rgba(0, 0, 0, 1));
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 500; color: white;
        }

        .menu-title {
            font-size: 3rem; font-weight: 900; letter-spacing: 5px; margin-bottom: 30px;
            color: #f1c40f; text-shadow: 0 0 20px rgba(241, 196, 15, 0.5);
            text-align: center; text-transform: uppercase;
        }

        .btn {
            width: 280px; padding: 15px; margin: 10px;
            font-size: 1.1rem; font-weight: bold; color: white;
            background: rgba(255, 255, 255, 0.1); border: 2px solid #f1c40f;
            border-radius: 12px; cursor: pointer; transition: 0.3s;
            text-align: center; pointer-events: auto; z-index: 600;
        }

        .btn:hover { background: #f1c40f; color: #1a1a1a; }

        #ui-overlay, #round-info {
            position: absolute; color: white; z-index: 100; display: none; pointer-events: none;
        }

        #ui-overlay { top: 20px; left: 20px; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 10px; }
        #round-info { top: 20px; right: 20px; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 10px; text-align: right; }

        .health-bar { width: 200px; height: 12px; background: #444; border-radius: 6px; overflow: hidden; }
        #health-fill { width: 100%; height: 100%; background: #2ecc71; transition: 0.3s; }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%);
            display: none; pointer-events: none; z-index: 50;
        }

        #game-msg {
            position: absolute; top: 25%; width: 100%; text-align: center;
            color: #f1c40f; font-size: 2rem; font-weight: bold; display: none; z-index: 150;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <h1 style="margin-bottom: 10px;">BOXING ARENA</h1>
        <p id="loading-text">Caricamento asset 3D...</p>
    </div>

    <div id="game-msg"></div>

    <div id="ui-overlay">
        <h3 id="room-display" style="margin:0; color:#f1c40f;">ARENA</h3>
        <div style="font-size: 0.8rem; margin: 5px 0;">SALUTE:</div>
        <div class="health-bar"><div id="health-fill"></div></div>
        <button class="btn" style="width:100px; padding:5px; font-size:0.7rem; margin-top:10px; pointer-events:auto;" onclick="location.reload()">ESCI</button>
    </div>

    <div id="round-info">
        <div id="current-round-text" style="color:#f1c40f;">ROUND 1/3</div>
        <div id="score-text">Vinti: 0</div>
    </div>

    <div id="main-menu">
        <h1 class="menu-title">Boxing Arena</h1>
        <button class="btn" onclick="startSingle()">Allenamento (BOT)</button>
        <button class="btn" onclick="showMenu('multiplayer-menu')">Sfida Online</button>
    </div>

    <div id="multiplayer-menu">
        <h2 class="menu-title">Lobby</h2>
        <div id="room-list" style="width: 300px; max-height: 200px; overflow-y: auto; margin-bottom: 20px;"></div>
        <button class="btn" onclick="showMenu('room-settings')">Crea Stanza</button>
        <button class="btn" onclick="showMenu('main-menu')">Indietro</button>
    </div>

    <div id="room-settings">
        <h2 class="menu-title">Nuova Sfida</h2>
        <input type="text" id="room-name-input" placeholder="Nome Stanza" style="padding:10px; margin-bottom:10px; width:260px; border-radius:8px; border:none;">
        <button class="btn" onclick="createRoom()">Inizia</button>
        <button class="btn" onclick="showMenu('multiplayer-menu')">Annulla</button>
    </div>

    <div id="crosshair"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.js",
                "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, collection, doc, setDoc, onSnapshot, updateDoc, addDoc } from 'firebase/firestore';

        // Configurazione
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'boxing-arena-v3';

        let user = null;
        let health = 100;
        let gameStarted = false;
        let gameMode = 'single'; // 'single' o 'multi'

        // --- INIZIALIZZAZIONE ---
        window.onload = async () => {
            document.getElementById('loading-text').innerText = "Connessione al server...";
            try {
                await signInAnonymously(auth);
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('main-menu').style.display = 'flex';
            } catch (e) {
                document.getElementById('loading-text').innerText = "Errore di connessione. Riprova.";
                console.error(e);
            }
        };

        onAuthStateChanged(auth, u => { user = u; });

        // --- MENU ---
        window.showMenu = (id) => {
            ['main-menu', 'multiplayer-menu', 'room-settings'].forEach(m => {
                document.getElementById(m).style.display = (m === id) ? 'flex' : 'none';
            });
            if(id === 'multiplayer-menu') loadRooms();
        };

        // --- GRAFICA ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const playerGroup = new THREE.Group();
        playerGroup.add(camera);
        playerGroup.position.set(0, 1.7, 5);
        scene.add(playerGroup);

        // Luci e Pavimento
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 5);
        scene.add(light);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.MeshStandardMaterial({color: 0x3d5a2d}));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const ring = new THREE.Mesh(new THREE.BoxGeometry(10, 0.2, 10), new THREE.MeshStandardMaterial({color: 0xcc0000}));
        ring.position.y = 0.1;
        scene.add(ring);

        // --- LOGICA GIOCO ---
        window.startSingle = () => {
            gameMode = 'single';
            startGame("Allenamento");
        };

        window.createRoom = async () => {
            const name = document.getElementById('room-name-input').value || "Arena";
            gameMode = 'multi';
            startGame(name);
        };

        function startGame(title) {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('room-settings').style.display = 'none';
            document.getElementById('ui-overlay').style.display = 'block';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('room-display').innerText = title;
            gameStarted = true;
            renderer.domElement.requestPointerLock();
        }

        // Movimento
        const keys = {};
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;

        document.addEventListener('mousemove', e => {
            if(document.pointerLockElement) {
                playerGroup.rotation.y -= e.movementX * 0.002;
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            if(!gameStarted) return;

            const speed = 0.1;
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(playerGroup.quaternion);
            const side = new THREE.Vector3(1, 0, 0).applyQuaternion(playerGroup.quaternion);

            if(keys['KeyW']) playerGroup.position.addScaledVector(forward, speed);
            if(keys['KeyS']) playerGroup.position.addScaledVector(forward, -speed);
            if(keys['KeyA']) playerGroup.position.addScaledVector(side, -speed);
            if(keys['KeyD']) playerGroup.position.addScaledVector(side, speed);

            renderer.render(scene, camera);
        }
        animate();

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };

        async function loadRooms() {
            // Qui andrebbe la logica Firestore per caricare le stanze
            console.log("Caricamento stanze...");
        }

    </script>
</body>
</html>
